plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.sinshorts'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.sinshorts'
        minSdk 26
        targetSdk 35
        versionCode 20
        versionName '2.9'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
